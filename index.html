<style>
:root{
  --bar:#16202C; --bar-ink:#E6ECF3; --bar-muted:#93A1B3; --active:#6FA8F0; --line:#2C3746; --bg:#EDF1F6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bar:#0C1117; --bar-ink:#E6ECF3; --bar-muted:#8492A4; --active:#6FA8F0; --line:#222C38; --bg:#10151C; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bar:#0C1117; --bar-ink:#E6ECF3; --bar-muted:#8492A4; --active:#6FA8F0; --line:#222C38; --bg:#10151C; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{background:var(--bar)}
body{display:flex;flex-direction:column;background:var(--bg);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
.top{flex:none;background:var(--bar);color:var(--bar-ink);display:flex;align-items:stretch;gap:18px;padding:0 14px;border-bottom:1px solid var(--line)}
.brand{flex:none;display:flex;align-items:center;font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--bar-muted);font:inherit;font-weight:500;font-size:.95rem;padding:15px 10px 12px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--bar-ink)}
.tab[aria-selected="true"]{color:var(--bar-ink);font-weight:700;border-bottom-color:var(--active)}
.tab:focus-visible{outline:2px solid var(--active);outline-offset:-4px;border-radius:6px}
.pane{flex:1;width:100%;border:0;display:block;min-height:0;background:var(--bg)}
.pane[hidden]{display:none}
@media (max-width:560px){ .brand{display:none} .top{padding:0 6px} }
</style>

const decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
const keys = Object.keys(APPS);
function show(k){
  if(!APPS[k]) k = keys[0];
  keys.forEach(x => {
    const on = x === k;
    document.getElementById("t-"+x).setAttribute("aria-selected", on);
    document.getElementById("t-"+x).tabIndex = on ? 0 : -1;
    const f = document.getElementById("p-"+x);
    if(on && !f.srcdoc) f.srcdoc = decode(APPS[x]);
    f.hidden = !on;
  });
  document.getElementById("t-"+k).scrollIntoView({block:"nearest",inline:"nearest"});
  // En la vista previa de Claude la página corre dentro de un iframe y no deja tocar el historial
  try{ if(location.hash.slice(1) !== k) history.replaceState(null, "", "#"+k); }catch(e){}
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => show(b.dataset.app)));
document.querySelector(".tabs").addEventListener("keydown", e => {
  const i = keys.indexOf(document.activeElement.dataset.app);
  if(i < 0) return;
  let j = e.key==="ArrowRight" ? i+1 : e.key==="ArrowLeft" ? i-1 : null;
  if(j===null) return;
  j = (j + keys.length) % keys.length;
  show(keys[j]); document.getElementById("t-"+keys[j]).focus(); e.preventDefault();
});
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
